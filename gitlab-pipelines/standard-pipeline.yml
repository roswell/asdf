###############################################################################
# Global configuration
###############################################################################

variables:
  # Just let the runner fetch and update the submodules for us.
  GIT_SUBMODULE_STRATEGY: normal
  I_AGREE_TO_ALLEGRO_EXPRESS_LICENSE: "yes"
  CI_DEBUG_TRACE: 0
  ALLOW_FAILURE: false
  # set the architecture, for CMUCL
  SET_ARCH: "false"

# Split regression testing into a separate stage than upgrade tests. The
# upgrade tests tend to run slower and are generally less important than
# regression tests for most changes.
stages:
  - build
  - regression
  - upgrade

# This is needed otherwise the jobs won't always be added to MR pipelines. We
# can just say when: always because this is run as a child pipeline and only
# triggered under the desired conditions.
workflow:
  rules:
    - when: always

###############################################################################
# Build jobs
###############################################################################

.on_cl_net:
  rules:
    - if: '$CI_SERVER_URL == "https://gitlab.common-lisp.net"'

.on_sift_net:
  tags:
    - docker
  rules:
    - if: '$CI_SERVER_URL == "https://git.sift.net"'

.matrix_common_lisp:
  parallel:
    matrix:
      - l: sbcl
        IMAGE: rpgoldman/sbcl:trixie

      - l: allegro
        IMAGE: rpgoldman/allegro11express

      - l: allegro
        IMAGE: rpgoldman/allegro11express
        variant: modern

      - l: abcl
        IMAGE: rpgoldman/abcl:1.9.2-jdk21-jammy

      - l: ccl
        IMAGE: clfoundation/ccl:1.13-trixie

      - l: clisp

      - l: ecl
        IMAGE: rpgoldman/ecl:26.3.27-trixie

      - l: cmucl

.matrix_regression_pass:
  parallel:
    matrix:
      - l: sbcl
        IMAGE: rpgoldman/sbcl:trixie

      - l: allegro
        IMAGE: rpgoldman/allegro11express

      - l: allegro
        IMAGE: rpgoldman/allegro11express
        variant: modern

      - l: abcl
        IMAGE: rpgoldman/abcl:1.9.2-jdk21-jammy

      - l: ccl
        IMAGE: clfoundation/ccl:1.13-trixie

      - l: clisp

.matrix_regression_fail:
  parallel:
    matrix:
      - l: ecl
        IMAGE: rpgoldman/ecl:26.3.27-trixie

      - l: cmucl


.build_ASDF:
  stage: build
  image:
    name: rpgoldman/sbcl:trixie
    # entrypoint: ["/bin/bash"]
  script:
    # - echo "Running custom entrypoint."
    - make
  artifacts:
    when: always
    paths:
      - build/asdf.lisp

build_ASDF_sift:
  extends:
    - .build_ASDF
    - .on_sift_net

build_ASDF_cl_net:
  extends:
    - .build_ASDF
    - .on_cl_net

.build_docs:
  stage: build
  image:
    name: buildpack-deps:trixie
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends texinfo texlive
    - make -C doc
  artifacts:
    when: always
    paths:
      - doc/asdf.html
      - doc/asdf.info
      - doc/asdf.pdf
      - doc/*.log

build_docs_sift:
  extends:
    - .build_docs
    - .on_sift_net

build_docs_cl_net:
  extends:
    - .build_docs
    - .on_cl_net

