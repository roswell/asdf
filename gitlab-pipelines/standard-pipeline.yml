###############################################################################
# Regression tests
###############################################################################

.Regression test template:
  stage: regression
  rules:
    - when: never
  image:
    name: $IMAGE
    entrypoint: [""]
  variables:
    RUNNER_SCRIPT_TIMEOUT: 60m
    IMAGE_TAG: latest
    IMAGE: containers.common-lisp.net/cl-docker-images/$l:$IMAGE_TAG
  script:
    - export l=$l$variant
    - make
    - make test
  artifacts:
    when: always
    paths:
      - build/results
  needs: []
  retry:
    max: 2
    when:
      - job_execution_timeout

