###############################################################################
# Regression tests
###############################################################################

.Regression test template:
  stage: regression
  rules:
    - when: never
  image:
    name: $IMAGE
    entrypoint: [""]
  variables:
    IMAGE_TAG: latest
    IMAGE: containers.common-lisp.net/cl-docker-images/$l:$IMAGE_TAG
  script:
    - export l=$l$variant
    - make
    - make test
  artifacts:
    when: always
    paths:
      - build/results
  needs: []
  retry:
    max: 2
    when:
      - job_execution_timeout

Regression test:
  extends: .Regression test template
  parallel:
    matrix:
      - l: [abcl, ccl, clisp, cmucl, ecl, sbcl]
        IMAGE_TAG: latest
      - l: clasp
        IMAGE_TAG: "b14e329f49998275579926da2a737885ceb2cea7"
      # drop ancient ABCL version
      # - l: abcl
      #   IMAGE_TAG: 1.7.1-jdk8
      - l: allegro
        IMAGE: rpgoldman/allegro11express
      - l: allegro
        IMAGE: rpgoldman/allegro11express
        variant: modern

Regression test new:
  rules:
    - when: never
  extends: .Regression test template
  image:
    name: $IMAGE
    entrypoint: []
  parallel:
    matrix:
      - l: ccl
        IMAGE: rpgoldman/ccl:1.13-trixie
      - l: sbcl
        IMAGE: rpgoldman/sbcl:trixie

###############################################################################
# Upgrade tests
###############################################################################

.Upgrade test template:
  stage: upgrade
  rules:
    - when: never
  image:
    name: $IMAGE
    entrypoint: [""]
  variables:
    IMAGE_TAG: latest
    IMAGE: containers.common-lisp.net/cl-docker-images/$l:$IMAGE_TAG
  script:
    - export l=$l$variant
    - make
    - make test-upgrade
  artifacts:
    when: always
    paths:
      - build/results/$l-upgrade.text
  needs: []
  rules:
    - if: $RUN_UPGRADE_TESTS

Upgrade test:
  extends: .Upgrade test template
  parallel:
    matrix:
      - l: [abcl, ccl, clisp, cmucl, ecl, sbcl]
        IMAGE_TAG: latest
      - l: clasp
        IMAGE_TAG: "b14e329f49998275579926da2a737885ceb2cea7"
      - l: allegro
        IMAGE: rpgoldman/allegro11express
      - l: allegro
        IMAGE: rpgoldman/allegro11express
        variant: modern

