#       - l: allegro
#         IMAGE: rpgoldman/allegro11express
#       - l: allegro
#         IMAGE: rpgoldman/allegro11express
#         variant: modern

.regression_test:
  rules:
    - when: always
  extends:
    - .Regression test template
    - .matrix_regression_pass
  image:
    name: $IMAGE
    entrypoint: [""]

regression_test_sift:
  extends:
    - .regression_test
    - .on_sift_net

regression_test_cl_net:
  extends:
    - .regression_test
    - .on_cl_net


.regression_tests_with_known_failures:
  rules:
    - when: always               # can't be run because of timeout.
  allow_failure: true
  # variables:
  #   RUNNER_SCRIPT_TIMEOUT: 90m
  extends:
    - .regression_test
    - .matrix_regression_fail

regression_test_fail_sift:
  extends:
    - .regression_tests_with_known_failures
    - .on_sift_net

regression_test_fail_cl_net:
  extends:
    - .regression_tests_with_known_failures
    - .on_cl_net


###############################################################################
# Upgrade tests
###############################################################################

.Upgrade test template:
  stage: upgrade
  rules:
    - when: never
    - if: $RUN_UPGRADE_TESTS
  image:
    name: $IMAGE
    entrypoint: [""]
  variables:
    IMAGE_TAG: latest
    IMAGE: containers.common-lisp.net/cl-docker-images/$l:$IMAGE_TAG
  script:
    - export l=$l$variant
    - make
    - make test-upgrade
  artifacts:
    when: always
    paths:
      - build/results/$l-upgrade.text
  needs: []

.upgrade_test:
  extends:
    - .Upgrade test template
    - .matrix_common_lisp

upgrade_test_sift:
  extends:
    - .upgrade_test
    - .on_sift_net

upgrade_test_cl_net:
  extends:
    - .upgrade_test
    - .on_cl_net

.REQUIRE upgrade test template:
  extends: .Upgrade test template
  # disable temporarily
  # rules:
  #   - if: $RUN_UPGRADE_TESTS
  #     when: never
  #   - when: on_success

.REQUIRE_upgrade_test:
  extends:
    - .REQUIRE upgrade test template
    - .matrix_common_lisp
  variables:
    ASDF_UPGRADE_TEST_TAGS: REQUIRE

REQUIRE_upgrade_test_sift:
  extends:
    - .REQUIRE_upgrade_test
    - .on_sift_net

REQUIRE_upgrade_test_cl_net:
  extends:
    - .REQUIRE_upgrade_test
    - .on_cl_net



